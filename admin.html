<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Orders · Noir & Bean</title>
<link rel="stylesheet" href="style.css">
<style>
  body{font-family:Arial,sans-serif;font-size:15px}
  [hidden]{display:none!important}
  .adm-login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .adm-login form{width:100%;max-width:360px;padding:32px;border:1px solid #4b3925;background:#211a14;display:grid;gap:14px}
  .adm-login h1{font:500 1.6rem Georgia,serif;line-height:1.2}
  .adm-bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 5%;border-bottom:1px solid #332a20;background:#17130f;position:sticky;top:0;z-index:5}
  .adm-tabs{display:flex;gap:8px}
  .adm-tab{padding:9px 18px;border:1px solid #4b3925;background:transparent;color:#cfc2af;cursor:pointer;font-size:13px}
  .adm-tab.active{background:#c99a5b;border-color:#c99a5b;color:#17130f}
  .adm-main{padding:28px 5% 80px;max-width:1000px;margin:0 auto}
  .adm-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
  .adm-msg{min-height:22px;margin-bottom:12px;color:#c99a5b;font-size:14px}
  .adm-empty{color:#958978;padding:30px 0}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid #40352a;background:#17130f;color:#f4ead9;outline:none;font-size:15px}
  input:focus,select:focus,textarea:focus{border-color:#c99a5b}
  :focus-visible{outline:2px solid #c99a5b;outline-offset:2px}
  label{display:grid;gap:6px;color:#c99a5b;font-size:12px;letter-spacing:.5px}
  .adm-select{width:auto;min-width:150px}
  .adm-btn{padding:10px 18px;border:1px solid #c99a5b;background:transparent;color:#c99a5b;cursor:pointer;font-size:13px}
  .adm-btn.primary{background:#c99a5b;color:#17130f}
  .adm-btn.danger{border-color:#a4523f;color:#e08f7a}
  .adm-btn:disabled{opacity:.5}

  .order{padding:20px;margin-bottom:14px;border:1px solid #4b3925;background:#211a14;border-left:4px solid #4b3925}
  .order.st-new{border-left-color:#c99a5b}
  .order.st-preparing{border-left-color:#7d9fbf}
  .order.st-done,.order.st-cancelled{opacity:.65}
  .order-top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
  .order-top strong{font:500 1.25rem Georgia,serif}
  .order-top small{color:#958978;margin-left:8px}
  .order-info{display:grid;gap:4px;color:#cfc2af;margin-bottom:12px}
  .order-info a{color:#c99a5b;text-decoration:underline}
  .order ul{list-style:none;border-top:1px solid #342a20}
  .order li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #342a20}
  .order-total{display:flex;justify-content:space-between;padding-top:12px;font-weight:bold}
  .order-total span:last-child{color:#c99a5b}
  .order.st-ready{border-left-color:#7dbf8f}
  .badge{padding:4px 12px;border:1px solid #4b3925;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#cfc2af}
  .st-new .badge{border-color:#c99a5b;color:#c99a5b}
  .st-preparing .badge{border-color:#7d9fbf;color:#7d9fbf}
  .st-ready .badge{border-color:#7dbf8f;color:#7dbf8f}
  .chip{display:inline-block;margin-right:8px;padding:2px 8px;background:#c99a5b;color:#17130f;font-size:11px;font-weight:bold;letter-spacing:1px;text-transform:uppercase}
  .eta-line{margin:12px 0 0;color:#cfc2af}
  .eta-line.late{color:#e08f7a;font-weight:bold}
  .order-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid #342a20}
  .order-actions label{display:flex;align-items:center;gap:8px;color:#cfc2af;font-size:13px;letter-spacing:0}
  .order-actions select{width:auto;padding:9px 10px}
  .adm-stats{margin-bottom:16px;color:#cfc2af;font-size:14px}

  .adm-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px;margin-bottom:26px;border:1px solid #4b3925;background:#211a14}
  .adm-form .wide{grid-column:1/-1}
  .adm-form .check{display:flex;align-items:center;gap:10px;color:#f4ead9;font-size:14px}
  .adm-form .check input{width:auto}
  .adm-form .actions{display:flex;gap:10px;flex-wrap:wrap}
  .mitem{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:10px;border:1px solid #4b3925;background:#211a14}
  .mitem img{width:56px;height:56px;flex:none}
  .mitem .thumb{width:56px;height:56px;flex:none;background:#17130f}
  .mitem .info{flex:1;min-width:0}
  .mitem .info b{display:block}
  .mitem .info small{color:#958978}
  .mitem.off{opacity:.55}
  .mitem .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  @media(max-width:640px){.adm-form{grid-template-columns:1fr}.mitem{flex-wrap:wrap}.mitem .btns{width:100%;justify-content:flex-start}}
</style>
</head>
<body>

<div id="loginView" class="adm-login" hidden>
  <form id="loginForm">
    <h1>Noir & Bean admin</h1>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="adm-btn primary" type="submit">Log in</button>
    <p id="loginMsg" class="adm-msg" role="alert"></p>
  </form>
</div>

<div id="appView" hidden>
  <header class="adm-bar">
    <div class="adm-tabs">
      <button class="adm-tab active" id="tabOrders" type="button">Orders</button>
      <button class="adm-tab" id="tabMenu" type="button">Menu</button>
    </div>
    <button class="adm-btn" id="logoutBtn" type="button">Log out</button>
  </header>

  <main class="adm-main">
    <p id="adminMsg" class="adm-msg" role="status"></p>

    <section id="ordersView">
      <div class="adm-row">
        <select id="statusFilter" class="adm-select" aria-label="Filter orders by status">
          <option value="active">Active orders</option>
          <option value="">All orders</option>
          <option value="new">New</option>
          <option value="preparing">Preparing</option>
          <option value="ready">Ready / out for delivery</option>
          <option value="done">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="adm-btn" id="refreshBtn" type="button">Refresh</button>
      </div>
      <p id="stats" class="adm-stats"></p>
      <div id="orderList"></div>
    </section>

    <section id="menuView" hidden>
      <form id="menuForm" class="adm-form">
        <label>Item name<input id="mName" maxlength="80" required></label>
        <label>Price (₹)<input id="mPrice" type="number" min="0" step="1" required></label>
        <label class="wide">Description<input id="mDesc" maxlength="200"></label>
        <label class="wide">Image URL<input id="mImg" maxlength="500" placeholder="https://… or /images/latte.jpg"></label>
        <label>Order on menu (1 = first)<input id="mSort" type="number" step="1" value="0"></label>
        <label class="check"><input id="mAvail" type="checkbox" checked> Available to order</label>
        <div class="actions wide">
          <button class="adm-btn primary" id="saveBtn" type="submit">Add item</button>
          <button class="adm-btn" id="cancelBtn" type="button" hidden>Cancel edit</button>
        </div>
      </form>
      <div id="menuList"></div>
    </section>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);

let token = sessionStorage.getItem("adminToken") || "";
let orders = [], menuItems = [], editingId = null, timer = null, msgTimer = null;

// Small DOM helper. Text is always inserted as text, never as HTML.
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  n.append(...kids.flat().filter((k) => k != null && k !== false));
  return n;
}

function say(text) {
  $("#adminMsg").textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => ($("#adminMsg").textContent = ""), 4000);
}

async function api(path, method = "GET", body) {
  const res = await fetch("/api/admin" + path, {
    method,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { logout(); throw new Error("Please log in again."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed.");
  return data;
}

// ---------- login / logout ----------
function showLogin() {
  $("#appView").hidden = true;
  $("#loginView").hidden = false;
}

function logout() {
  token = "";
  sessionStorage.removeItem("adminToken");
  clearInterval(timer);
  document.title = "Orders · Noir & Bean";
  showLogin();
}

async function showApp() {
  $("#loginView").hidden = true;
  $("#appView").hidden = false;
  await Promise.all([loadOrders(), loadMenu()]);
  clearInterval(timer);
  timer = setInterval(() => {
    // don't rebuild the list while the owner is choosing from a drop-down
    if (!$("#ordersView").hidden && document.activeElement?.tagName !== "SELECT") loadOrders();
  }, 20000);
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginMsg").textContent = "";
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("#password").value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Login failed.");
    token = data.token;
    sessionStorage.setItem("adminToken", token);
    $("#password").value = "";
    showApp();
  } catch (err) {
    $("#loginMsg").textContent = err.message;
  }
});

$("#logoutBtn").addEventListener("click", logout);

// ---------- tabs ----------
function openTab(name) {
  const showOrders = name === "orders";
  $("#ordersView").hidden = !showOrders;
  $("#menuView").hidden = showOrders;
  $("#tabOrders").classList.toggle("active", showOrders);
  $("#tabMenu").classList.toggle("active", !showOrders);
  if (showOrders) loadOrders();
}
$("#tabOrders").addEventListener("click", () => openTab("orders"));
$("#tabMenu").addEventListener("click", () => openTab("menu"));

// ---------- orders ----------
const ETA_CHOICES = [10, 15, 20, 25, 30, 45, 60];
const etaChoice = new Map();   // remembers the ETA picked for each order while the list refreshes
let clockOffset = 0;           // server time minus this device's time
let lastNewCount = null;

const nowMs = () => Date.now() + clockOffset;
const clock = (ms) => new Date(ms).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
const mins = (ms) => Math.max(0, Math.round(ms / 60000));

async function loadOrders() {
  try {
    const data = await api("/orders");
    clockOffset = Date.parse(data.now) - Date.now();
    orders = data.orders;
    renderOrders();
  } catch (err) { say(err.message); }
}

// Short beep when a new order arrives (needs a click on the page first, which logging in provides).
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch {}
}

const ACTIVE = ["new", "preparing", "ready"];

function renderOrders() {
  const filter = $("#statusFilter").value;
  const list = orders
    .filter((o) => (filter === "active" ? ACTIVE.includes(o.status) : !filter || o.status === filter))
    .sort((a, b) => {
      const aa = ACTIVE.includes(a.status), bb = ACTIVE.includes(b.status);
      if (aa !== bb) return aa ? -1 : 1;
      return aa ? a.id - b.id : b.id - a.id;   // kitchen queue: oldest active order first
    });
  $("#orderList").replaceChildren(
    ...(list.length ? list.map(orderCard) : [h("p", { class: "adm-empty" }, "No orders here.")])
  );

  const count = (s) => orders.filter((o) => o.status === s).length;
  const today = orders.filter((o) => o.status === "done" && o.done_at && new Date(o.done_at).toDateString() === new Date(nowMs()).toDateString());
  const avg = today.length ? Math.round(today.reduce((t, o) => t + mins(Date.parse(o.done_at) - Date.parse(o.created_at)), 0) / today.length) : null;
  $("#stats").textContent = `New ${count("new")} · Preparing ${count("preparing")} · Ready ${count("ready")}` +
    (avg !== null ? ` · Today: ${today.length} completed, average ${avg} min` : "");

  const fresh = count("new");
  document.title = (fresh ? `(${fresh}) ` : "") + "Orders · Noir & Bean";
  if (lastNewCount !== null && fresh > lastNewCount) beep();
  lastNewCount = fresh;
}

async function changeOrder(o, body) {
  try { await api("/orders/" + o.id, "PATCH", body); }
  catch (err) { say(err.message); }
  loadOrders();
}

function orderCard(o) {
  const now = nowMs();
  const placed = Date.parse(o.created_at);
  const pickup = o.order_type === "pickup";
  const active = ACTIVE.includes(o.status);
  const eta = o.eta_at ? Date.parse(o.eta_at) : null;
  const btn = (text, onclick, cls = "") => h("button", { class: "adm-btn " + cls, type: "button", onclick }, text);
  const status = (text, next, extra = {}, cls = "") => btn(text, () => changeOrder(o, { status: next, ...extra }), cls);

  // time tracking line
  let timing = "";
  if (o.done_at) timing = `Total time ${mins(Date.parse(o.done_at) - placed)} min`;
  else if (active) timing = `Waiting ${mins(now - placed)} min`;

  let etaLine = null;
  if (eta && (o.status === "preparing" || (o.status === "ready" && !pickup))) {
    etaLine = eta > now
      ? h("p", { class: "eta-line" }, `ETA ${clock(eta)} — in ${mins(eta - now)} min`)
      : h("p", { class: "eta-line late" }, `Overdue by ${mins(now - eta)} min (customer sees "taking longer")`);
  }

  const actions = [];
  if (o.status === "new") {
    const chosen = etaChoice.get(o.id) || 20;
    actions.push(
      h("label", {}, pickup ? "Ready in" : "Arrives in",
        h("select", { "aria-label": "Estimated minutes", onchange: (e) => etaChoice.set(o.id, Number(e.target.value)) },
          ...ETA_CHOICES.map((m) => h("option", { value: m, selected: m === chosen }, m + " min")))),
      btn("Accept order", () => changeOrder(o, { status: "preparing", eta_minutes: etaChoice.get(o.id) || 20 }), "primary"),
      status("Cancel", "cancelled", {}, "danger"));
  } else if (o.status === "preparing") {
    actions.push(
      btn("+5 min", () => changeOrder(o, { eta_add_minutes: 5 })),
      btn("+10 min", () => changeOrder(o, { eta_add_minutes: 10 })),
      status(pickup ? "Mark ready" : "Out for delivery", "ready", {}, "primary"),
      status("Cancel", "cancelled", {}, "danger"));
  } else if (o.status === "ready") {
    if (!pickup) actions.push(btn("+5 min", () => changeOrder(o, { eta_add_minutes: 5 })));
    actions.push(
      status(pickup ? "Picked up — complete" : "Delivered — complete", "done", {}, "primary"),
      status("Undo", "preparing"));
  } else if (o.status === "done") {
    actions.push(status("Undo", "ready"));
  } else {
    actions.push(status("Reopen", "new"));
  }

  const when = new Date(o.created_at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
  const labels = { new: "New", preparing: "Preparing", ready: pickup ? "Ready" : "Out for delivery", done: "Completed", cancelled: "Cancelled" };

  return h("article", { class: "order st-" + o.status },
    h("div", { class: "order-top" },
      h("div", {}, h("strong", {}, "#" + o.id), h("small", {}, when + (timing ? " · " + timing : ""))),
      h("span", { class: "badge" }, labels[o.status])),
    h("div", { class: "order-info" },
      h("span", {}, h("span", { class: "chip" }, pickup ? "Pickup" : "Delivery"), o.customer_name + " · ",
        h("a", { href: "tel:" + o.phone.replace(/[^\d+]/g, "") }, o.phone)),
      pickup ? null : h("span", {}, o.address),
      o.note ? h("span", {}, "Note: " + o.note) : null),
    h("ul", {}, ...o.items.map((i) => h("li", {}, h("span", {}, `${i.name} × ${i.qty}`), h("span", {}, "₹" + i.price * i.qty)))),
    h("div", { class: "order-total" }, h("span", {}, "Total"), h("span", {}, "₹" + o.total)),
    etaLine,
    h("div", { class: "order-actions" }, ...actions));
}

$("#statusFilter").addEventListener("change", renderOrders);
$("#refreshBtn").addEventListener("click", loadOrders);

// ---------- menu ----------
async function loadMenu() {
  try {
    menuItems = await api("/menu");
    renderMenu();
  } catch (err) { say(err.message); }
}

function renderMenu() {
  $("#menuList").replaceChildren(
    ...(menuItems.length ? menuItems.map(menuRow) : [h("p", { class: "adm-empty" }, "No items yet. Add your first one above.")])
  );
}

function menuRow(m) {
  const thumb = m.image_url ? h("img", { src: m.image_url, alt: "" }) : h("div", { class: "thumb" });
  return h("div", { class: "mitem" + (m.available ? "" : " off") },
    thumb,
    h("div", { class: "info" }, h("b", {}, m.name), h("small", {}, `₹${m.price}` + (m.available ? "" : " · Hidden from menu"))),
    h("div", { class: "btns" },
      h("button", { class: "adm-btn", type: "button", onclick: () => startEdit(m) }, "Edit"),
      h("button", { class: "adm-btn", type: "button", onclick: () => saveItem(m.id, { ...m, available: !m.available }, m.available ? "Hidden." : "Visible.") }, m.available ? "Hide" : "Show"),
      h("button", { class: "adm-btn danger", type: "button", onclick: () => removeItem(m) }, "Delete")));
}

function startEdit(m) {
  editingId = m.id;
  $("#mName").value = m.name;
  $("#mPrice").value = m.price;
  $("#mDesc").value = m.description;
  $("#mImg").value = m.image_url;
  $("#mSort").value = m.sort_order;
  $("#mAvail").checked = !!m.available;
  $("#saveBtn").textContent = "Save changes";
  $("#cancelBtn").hidden = false;
  $("#menuForm").scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetForm() {
  editingId = null;
  $("#menuForm").reset();
  $("#mSort").value = 0;
  $("#saveBtn").textContent = "Add item";
  $("#cancelBtn").hidden = true;
}

async function saveItem(id, body, doneText) {
  try {
    if (id) await api("/menu/" + id, "PUT", body);
    else await api("/menu", "POST", body);
    say(doneText);
    await loadMenu();
    return true;
  } catch (err) { say(err.message); return false; }
}

async function removeItem(m) {
  if (!confirm(`Delete "${m.name}"? Past orders keep their details.`)) return;
  try { await api("/menu/" + m.id, "DELETE"); say("Deleted."); loadMenu(); }
  catch (err) { say(err.message); }
}

$("#menuForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    name: $("#mName").value, description: $("#mDesc").value, price: $("#mPrice").value,
    image_url: $("#mImg").value, sort_order: $("#mSort").value, available: $("#mAvail").checked,
  };
  const ok = await saveItem(editingId, body, editingId ? "Changes saved." : "Item added.");
  if (ok) resetForm();
});
$("#cancelBtn").addEventListener("click", resetForm);

// ---------- start ----------
if (token) showApp(); else showLogin();
</script>
</body>
</html>
